<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Park Café - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-wrapper">
        <!-- LEFT SIDE ARTWORK -->
        <div class="auth-graphic-side">
            <img src="https://images.unsplash.com/photo-1542372147193-a7aca54189cd?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Coffee Beans">
        </div>

        <!-- RIGHT SIDE FORM FRAME -->
        <div class="auth-form-side">
            <div class="auth-header-brand">Central Perk Café</div>
            
            <h2>Create Your Account</h2>
            <div class="auth-subtitle">Join our digital living room for the finest brews and cozy moments.</div>

            <form>
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-container">
                        <input type="text" placeholder="Phoebe Buffay" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-container">
                        <input type="email" placeholder="smellycat@centralpark.com" required>
                    </div>
                </div>

                <div class="form-group row">
                    <div>
                        <label>Password</label>
                        <div class="input-container">
                            <input type="password" placeholder="••••••••" required>
                        </div>
                    </div>
                    <div>
                        <label>Confirm Password</label>
                        <div class="input-container">
                            <input type="password" placeholder="••••••••" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-auth-submit">Register Account</button>
            </form>

            <div class="auth-footer-redirect">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </div>
    </div>

</body>
</html>
