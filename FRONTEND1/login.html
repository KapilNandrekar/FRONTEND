<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Park Café - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-wrapper">
        <!-- LEFT SIDE ARTWORK -->
        <div class="auth-graphic-side">
            <img src="https://images.unsplash.com/photo-1606791405792-1004f1718d0c?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Cozy Cup">
        </div>
        <!-- RIGHT SIDE AUTH FRAME -->
        <div class="auth-form-side">
            <div class="auth-header-brand"> Central Perk Café</div>
            <h2>Welcome Back!</h2>
            <div class="auth-subtitle">We've missed you. Log in to your account to continue your coffee journey.</div>
            <form>
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-container">
                        <input type="email" placeholder="name@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-container">
                        <input type="password" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn-auth-submit">LOGIN</button>
            </form>
            <div class="auth-divider">OR</div>
            <button class="btn-google-auth">G Continue with Google</button>
            <div class="auth-footer-redirect">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </div>
        </div>
    </div>
</body>
</html>
